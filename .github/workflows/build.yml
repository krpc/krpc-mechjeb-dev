name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r doc/requirements.txt
      - run: python scripts/build_service.py
      # Builds the stubs and their archives first
      - run: python scripts/docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: krpc-mechjeb-dev
          # The release assets: the archive for the game, and the stub of each client
          path: build/krpc-mechjeb-dev-*.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/doc/html

  pages:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
